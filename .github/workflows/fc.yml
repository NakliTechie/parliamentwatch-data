name: FC scrape and publish

# 6×/day walk of the 3 Lok-Sabha Financial Committees (PAC, Estimates,
# COPU) via sansad.in's api_ls/committee/lsRSAllReports endpoint.
# Walks the API, merges into reports.json, extracts text from missing
# PDFs up to MAX_EXTRACTIONS_PER_RUN.
#
# Cadence rationale: every 4 hours, 25 PDFs/run = 150/day. Backfill
# of the ~800-report historical corpus (LS-14..18) clears in ~5-6
# days via small bursts. POLITENESS POLICY (see plan/adding-a-new-
# corpus.md §"Politeness policy"): never issue large one-shot
# dispatches; backfills always run through the same gentle cron the
# steady-state uses. Small bursts × many runs is the only acceptable
# scaling lever — runner-minute cost is trivial vs the risk of an
# upstream IP ban.
#
# LOK_SABHAS defaults to '14,15,16,17,18' so each cron firing walks
# the full 5-LS-term API space (15 cheap API calls), and the merge
# logic in build_fc.py preserves historical entries across runs.
# This keeps the backfill model honest: catch up via the cron, never
# through a high-budget dispatch.
#
# Off-hour minute (:23 UTC) off-cluster from existing crons
# (DRSC=:17, CAG=:17, Bills=:17, LC=:23 same minute but different
# hours). FC fires on the 01/05/09/13/17/21 odd-hour cycle to land
# in the windows LC leaves empty.
#
# No archive sidecar (sansad.in is the most-stable upstream we mirror
# — DRSC + Bills are already there with no archive). See
# plan/financial-committees-recon-001.md §"No archive sidecar needed".

on:
  schedule:
    - cron: '23 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      lok_sabhas:
        description: 'LS terms to walk (CSV, default = current 5 terms)'
        default: '14,15,16,17,18'
      max_extractions:
        description: 'Max PDFs to extract this run. Keep small (≤50) — never use this for one-shot backfills; that scales by cron firings, not by burst size.'
        default: '25'
      max_run_seconds:
        description: 'Hard wall-clock cap for the extraction phase, seconds'
        default: '900'

permissions:
  contents: write

concurrency:
  # Don't let two FC runs ever overlap — they would race on text/
  # writes and produce a noisy git diff. Independent of `cag`, `lc`,
  # `scrape` groups so all corpora can run concurrently.
  group: fc
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configure git identity for in-flight checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build FC primary data (extract phase only)
        # Split-phase: writers commit reports.json + text/<committee>/.
        # Derived files owned by fc-derive.yml (single owner,
        # cancel-in-progress). See CONV.md "Split-phase scraping
        # pattern" for the rationale.
        env:
          BUILD_PHASE:             'extract'
          LOK_SABHAS:              ${{ inputs.lok_sabhas      || '14,15,16,17,18' }}
          MAX_EXTRACTIONS_PER_RUN: ${{ inputs.max_extractions || '25' }}
          MAX_RUN_SECONDS:         ${{ inputs.max_run_seconds || '900' }}
          EXTRACT_WORKERS:         '4'
          JITTER_MIN_MS:           '250'
          JITTER_MAX_MS:           '500'
        run: python build_fc.py

      - name: Commit and push primary changes
        # Narrow git add to primary files only — reports.json + text/.
        # Derived files (manifest, meta, bundle, index) are
        # intentionally excluded; fc-derive.yml regenerates them after
        # this commit lands.
        #
        # `text/` is transient — its contents get bundled into
        # `texts-NN.json` shards by the derive step and the loose dir
        # may not exist in steady state. Stage it only if it exists and
        # is non-empty, otherwise an unconditional `git add` errors out
        # (exit 128) and surfaces a successful no-op run as failure.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/fc/reports.json
          if [ -d docs/fc/text ] && [ -n "$(ls -A docs/fc/text 2>/dev/null)" ]; then
            git add docs/fc/text/
          fi
          if git diff --cached --quiet; then
            echo "no primary changes — skipping push"
            exit 0
          fi
          git commit -m "Auto-update FC primary data [$(date -u +%Y-%m-%dT%H:%MZ)]"
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push attempt $attempt failed (race); retrying"; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 5 + 3))
          done
          echo "::error::failed to push after 5 attempts"; exit 1
