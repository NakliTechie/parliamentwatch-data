name: Debates derive (manifest + bundle + index + meta)

# Single-owner regeneration of debates' derived files. Triggered by
# any successful debates.yml primary write, plus a 30-min cron
# backstop, plus manual workflow_dispatch. Same pattern as cag-derive
# / lc-derive / fc-derive — see CONV.md "Split-phase scraping pattern".

on:
  workflow_run:
    workflows:
      - "Debates scrape and publish"
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debates-derive
  cancel-in-progress: true

jobs:
  derive:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Build debates derived files
        env:
          BUILD_PHASE: 'derive'
        run: python build_debates.py

      - name: Commit and push derived files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/debates/manifest.json docs/debates/meta.json docs/debates/audit.json \
                  docs/debates/search-bundle-*.json docs/debates/search-index-*.json
          git diff --cached --quiet && echo "no derived changes" && exit 0
          git commit -m "Auto-rebuild debates derived files [$(date -u +%Y-%m-%dT%H:%MZ)]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed; rebuilding on rebased state"
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            BUILD_PHASE=derive python build_debates.py
            git add docs/debates/manifest.json docs/debates/meta.json docs/debates/audit.json \
                    docs/debates/search-bundle-*.json docs/debates/search-index-*.json
            git diff --cached --quiet && echo "nothing to commit after retry" && exit 0
            git commit -m "Auto-rebuild debates derived files (retry $attempt) [$(date -u +%Y-%m-%dT%H:%MZ)]"
          done
          echo "exceeded 3 push attempts; giving up — next derive run will catch up"
          exit 1
