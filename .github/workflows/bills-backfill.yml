name: Bills (sansad-side) backfill (4-hourly, until corpus full)

on:
  schedule:
    # Retuned 2026-07-27: 2-hourly -> daily; 171 never-attempted left.
    # Was '17 */2 * * *'. The sprint that needed the fast cadence is done;
    # forward discovery (scrape/cag/bills-sansad) gets the slots back.
    # Bumped from `17 */4 * * *` (every 4h) → `17 */2 * * *` (every 2h)
    # to halve the time-to-clear on the never_attempted backlog. Bills
    # is at ~1660 never_attempted as of 2026-05-18; at the previous
    # 6×/day cadence × 200/run = 1200/day, the backlog was ~9 days from
    # clear. New 12×/day × 400/run = 4800/day target → ~2-3 days.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      max_extractions:
        # Bumped default 200 → 400 so the scheduled runs (which omit
        # this input and use the default) actually consume more of the
        # backlog per fire. Manual dispatches can still pass smaller
        # numbers when needed.
        description: 'Max PDFs to extract this run (politeness budget)'
        default: '400'
      max_run_seconds:
        description: 'Hard wall-clock cap for the extraction phase, seconds'
        default: '1800'

permissions:
  contents: write

concurrency:
  # Shared with bills-sansad.yml (the daily). Avoids racing on the same
  # docs/bills/text/* tree — both write extracted-text files and would
  # produce add/add conflicts on rebase otherwise. Same pattern as the
  # CAG concurrency group shared by cag.yml + cag-backfill.yml + cag-ocr.yml.
  group: bills-sansad
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configure git identity for in-flight checkpoint commits
        # See CONV.md "Per-file checkpoint pattern".
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build Bills (sansad-side) primary data (extract phase, backfill mode)
        # Split-phase: writers commit text/ + scraper-state only. Derived
        # files arrive in a separate commit from bills-derive.yml.
        # See CONV.md "Split-phase scraping pattern".
        env:
          BUILD_PHASE:             'extract'
          MAX_EXTRACTIONS_PER_RUN: ${{ inputs.max_extractions || '400' }}
          MAX_RUN_SECONDS:         ${{ inputs.max_run_seconds || '1800' }}
          EXTRACT_WORKERS:         '4'
          JITTER_MIN_MS:           '250'
          JITTER_MAX_MS:           '500'
        run: python build_bills_sansad.py

      - name: Commit and push primary changes
        # `text/` is transient — its contents get bundled into
        # `texts-NN.json` shards by the derive step and the loose dir
        # may not exist in steady state. Stage it only if it exists and
        # is non-empty, otherwise an unconditional `git add` errors out
        # (exit 128) and surfaces a successful no-op run as failure.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/bills/records.json docs/bills/.scraper_state.json
          if [ -d docs/bills/text ] && [ -n "$(ls -A docs/bills/text 2>/dev/null)" ]; then
            git add docs/bills/text/
          fi
          if git diff --cached --quiet; then
            echo "no primary changes — skipping push"
            exit 0
          fi
          git commit -m "Auto-update Bills (sansad) primary data (backfill) [$(date -u +%Y-%m-%dT%H:%MZ)]"
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push attempt $attempt failed (race); retrying"; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 5 + 3))
          done
          echo "::error::failed to push after 5 attempts"; exit 1
