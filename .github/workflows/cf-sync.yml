name: CF deploy (wrangler, 4h cadence)

# Every 4 hours, deploy the latest main HEAD to Cloudflare Workers
# Static Assets via wrangler. Single-branch model — we never push to
# any other branch; only main + a `last-cf-deploy` tag are maintained
# in this repo.
#
# Why wrangler instead of GitHub-integrated deploys: per-push builds
# burn the monthly free CF build quota on no-op timestamp-only
# changes. By batching deploys to every 4 h AND skipping when main
# hasn't advanced since the last deploy, the worst-case build cost
# falls from ~2,400/month to ~360/month across all three data repos.
#
# This repo carries the busiest push footprint (5 corpora × 2-3
# workflows each + a 30-min derive backstop), so the savings here
# are the most pronounced.
#
# Skip-if-unchanged: the last successfully-deployed SHA is recorded
# in the `last-cf-deploy` git tag. If main HEAD matches the tag, we
# skip the wrangler call entirely. With write_json_idempotent
# upstream (no-op derive runs produce no commits at all), this is
# the common case.
#
# Manual workflow_dispatch trigger is the escape hatch for urgent
# deploys.
#
# Required repo secrets:
#   - CLOUDFLARE_API_TOKEN   (Workers Scripts: Edit + Workers R2
#                             Storage: Edit, per existing r2-sync.yml)
#   - CLOUDFLARE_ACCOUNT_ID
#
# Required CF dashboard state: the project's GitHub integration must
# be disconnected (or the production branch pointed at a parked branch
# that nobody pushes to), so this workflow is the only source of
# deploys.

on:
  schedule:
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write   # write needed to push the last-cf-deploy tag

concurrency:
  group: cf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bumped from 15 → 60. parliamentwatch-data is the heaviest of the
    # three data repos (5 corpora's text shards + manifests + reports
    # JSONs in docs/), and wrangler-action's upload of the whole asset
    # directory was consistently hitting the 15-min timeout, getting
    # cancelled, and never producing a deploy. Audit 2026-05-16: 5/5
    # most-recent runs cancelled at exactly the 15-min mark. The other
    # two repos (gazettes, proceedings) are smaller and complete in
    # <2 min; 15 is fine for them.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      # Skip-if-unchanged removed for this repo on 2026-05-16. The
      # `git fetch --tags` step was reliably stalling at >15 min on
      # parliamentwatch-data's heavy history — making the cf-sync
      # workflow useless. Unconditional deploys at the 4 h cadence
      # = 180/month, well under quota. The marginal cost of an
      # unchanged deploy is wrangler's `Found N new or modified
      # static assets` check, which is fast (asset content hashes).

      - name: Deploy to Cloudflare Workers (wrangler)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin wrangler 4 so [assets] supports `run_worker_first` and
          # `binding`. wrangler 3 silently drops these as unknown fields
          # and the Worker never gets to intercept asset requests —
          # which broke CORS on 2026-05-16 (incognito users hit
          # "Failed to fetch" because no ACAO header). See
          # src/index.js + wrangler.toml.
          wranglerVersion: '4'
          command: deploy
