name: Questions scrape and publish

# 24×/day walk of Lok Sabha qetFilteredQuestionsAns across LS-15..18 ×
# sessions × types (STARRED + UNSTARRED), with per-question PDF download
# and pypdf extract — PLUS Rajya Sabha walk across the 2 most recent
# sessions (api_rs/business/{starredQuestionsItemWise,unStarredQuestionsItemWise})
# with per-sitting-day bundle PDF download.
#
# Cadence rationale (plan/questions-recon-001.md §"Politeness budget"):
# 50 records per burst × 24×/day = 1,200/day for LS. Clears the ~280K
# record LS-15..18 backlog in ~233 days. RS: 25 bundles/run × 24/day =
# 600/day → ~4.5 days for the ~2,700-bundle RS-194..270 backfill. Within
# Politeness policy: per-burst ≤50, ≥1-hour gaps (exactly 1 hour here).
# Per-PDF cost is ~250-500 ms (download + pypdf extract on 2-page
# typeset PDFs); 50 takes ~25 sec sustained across 4 workers.
#
# Off-cluster from LC (02/06/10/14/18/22 at :01), FC (01/05/09/13/17/21
# at :01), and debates (every 2h at :23). Questions fires at :47 every
# hour starting at 00:47 UTC.

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      lok_sabhas:
        description: 'LS terms to walk (CSV, default = LS-15..18 per recon coverage)'
        default: '15,16,17,18'
      ls_sessions:
        description: 'LS sessions to walk ("1-20" range or "1,2,3" CSV; empty = default 1..20)'
        default: ''
      ls_qtypes:
        description: 'LS question types (CSV: STARRED,UNSTARRED; empty = both)'
        default: ''
      rs_sessions:
        description: 'RS sessions to walk (CSV, "all" for full backfill, default = 2 most recent)'
        default: ''
      max_extractions:
        description: 'Max LS records to extract this run. Keep ≤50 per Politeness policy.'
        default: '50'
      max_rs_extractions:
        description: 'Max RS bundle PDFs to extract this run. Keep ≤25 per Politeness policy (bundles are heavier than LS per-Q PDFs).'
        default: '25'
      max_run_seconds:
        description: 'Hard wall-clock cap (seconds)'
        default: '900'

permissions:
  contents: write

concurrency:
  # Don't let two questions runs overlap. Independent of other corpora's
  # groups so all corpora can run concurrently.
  group: questions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configure git identity for in-flight checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build questions primary data (extract phase only)
        # Split-phase: writers commit reports shards + text/ls/.
        # Derived files owned by questions-derive.yml. See CONV.md
        # "Split-phase scraping pattern".
        env:
          BUILD_PHASE:                'extract'
          LOK_SABHAS:                 ${{ inputs.lok_sabhas         || '15,16,17,18' }}
          LS_SESSIONS:                ${{ inputs.ls_sessions        || '' }}
          LS_QTYPES:                  ${{ inputs.ls_qtypes          || '' }}
          RS_SESSIONS:                ${{ inputs.rs_sessions        || '' }}
          MAX_EXTRACTIONS_PER_RUN:    ${{ inputs.max_extractions    || '50' }}
          MAX_RS_EXTRACTIONS_PER_RUN: ${{ inputs.max_rs_extractions || '25' }}
          MAX_RUN_SECONDS:            ${{ inputs.max_run_seconds    || '900' }}
          EXTRACT_WORKERS:            '4'
          JITTER_MIN_MS:              '250'
          JITTER_MAX_MS:              '500'
        run: python build_questions.py

      - name: Commit and push primary changes
        # `docs/questions/` covers reports-meta.json + reports-<house>-<NN>.json
        # shards + text/ (transient .txt files + persistent markers).
        # Gitignored `pdfs/` won't be picked up by directory `git add`.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/questions/
          git diff --cached --quiet && echo "no primary changes" && exit 0
          git commit -m "Auto-update questions primary data [$(date -u +%Y-%m-%dT%H:%MZ)]"
          git pull --rebase origin main
          git push
