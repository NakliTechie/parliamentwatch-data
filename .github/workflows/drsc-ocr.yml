name: DRSC OCR slow-lane

on:
  schedule:
    # Retuned 2026-07-27: 4x/day -> weekly; DRSC backlog is 210, mostly retryable.
    # Was '37 */4 * * *'. The sprint that needed the fast cadence is done;
    # forward discovery (scrape/cag/bills-sansad) gets the slots back.
    # TEMP SPRINT CADENCE (2026-05-29): 4-hourly @ 25/run to drain the
    # ~335 pypdf-empty DRSC backlog fast (~2-3 days). Minute :37 staggers
    # off bills-OCR (:07) and the backfill (:17). REVERT to weekly
    # `47 5 * * 0` + default '5' once the backlog clears.
    - cron: '37 3 * * 0'
  workflow_dispatch:
    inputs:
      max_ocr_per_run:
        description: 'Max scanned PDFs to OCR this run (sprint default 25, 4-hourly; revert to 5 + weekly when backlog clears)'
        default: '25'
      max_run_seconds:
        description: 'Hard wall-clock cap for OCR phase (seconds, default 2700)'
        default: '2700'
      max_pages_per_pdf:
        description: 'Cap pages per PDF (default 300)'
        default: '300'
      render_dpi:
        description: 'pdf2image render DPI (default 150)'
        default: '150'

permissions:
  contents: write
  # Needed for the end-of-workflow chain step that fires another
  # workflow_dispatch when the manual sprint hits the budget cap but
  # backlog remains. See "Chain another OCR run if backlog remains" below.
  actions: write

concurrency:
  # Same group as scrape.yml (the DRSC primary writer). Both target the
  # same `text/<committee>/<file_id>.txt` paths for the same missing-text
  # candidate set, so they race on git. Serialise via the shared `scrape`
  # group. OCR is ~weekly cadence; the daily DRSC scrape isn't blocked
  # enough to matter, and OCR's candidate list is cleaner after the
  # daily has had its turn (populates the .pypdf-empty markers OCR
  # uses to pick candidates).
  group: scrape
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    # 350-min cap so a sprint dispatch can run for the full 5.7h
    # MAX_RUN_SECONDS=20400 budget without the GitHub 60-min default
    # killing it mid-chain. Matches lc-ocr.yml / fc-ocr.yml / cag-ocr.yml.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Install OCR system deps
        # tesseract-ocr — the OCR engine
        # tesseract-ocr-hin — Hindi language pack (some DRSC reports mix
        #                     English + Hindi sections)
        # poppler-utils — pdf2image renders pages via poppler's pdftoppm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-hin poppler-utils

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configure git identity for in-flight checkpoint commits
        # build_drsc_ocr.py commits per-OCR (CHECKPOINT_EVERY_N=2 default,
        # tuned for OCR's 3-8 min per-PDF cost) so a runner-killed mid-OCR
        # run loses at most one OCR's worth of work.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: OCR scanned PDFs
        id: ocr_run
        env:
          MAX_OCR_PER_RUN:    ${{ inputs.max_ocr_per_run    || '5' }}
          MAX_RUN_SECONDS:    ${{ inputs.max_run_seconds    || '2700' }}
          MAX_PAGES_PER_PDF:  ${{ inputs.max_pages_per_pdf  || '300' }}
          RENDER_DPI:         ${{ inputs.render_dpi         || '150' }}
          TESSERACT_LANGS:    'eng+hin'
        run: python build_drsc_ocr.py

      - name: Commit and push primary changes
        # OCR is part of the primary-write tier — it produces
        # text/<committee>/<file_id>.txt and tombstone files. Derived
        # files (manifest/bundle/index/meta) are regenerated by
        # drsc-derive.yml after this commit lands.
        #
        # `text/` is transient — its contents get bundled into
        # `texts-NN.json` shards by the derive step and the loose dir
        # may not exist in steady state. Stage it only if it exists and
        # is non-empty, otherwise an unconditional `git add` errors out
        # (exit 128) and surfaces a successful no-op run as failure.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d docs/drsc/text ] && [ -n "$(ls -A docs/drsc/text 2>/dev/null)" ]; then
            git add docs/drsc/text/
          fi
          if git diff --cached --quiet; then
            echo "no primary changes — skipping push"
            exit 0
          fi
          git commit -m "Auto-update DRSC OCR data [$(date -u +%Y-%m-%dT%H:%MZ)]"
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push attempt $attempt failed (race); retrying"; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 5 + 3))
          done
          echo "::error::failed to push after 5 attempts"; exit 1

      - name: Chain another OCR run if backlog remains
        # Sprint-completion mechanism. Only runs when this workflow was
        # triggered manually (workflow_dispatch) — never on the weekly
        # cron — and only re-fires when we made progress this run AND
        # there's still backlog. Self-terminates when:
        #   - remaining=0  → backlog cleared, no chain
        #   - processed=0  → no progress (all candidates timed out), abort
        #   - any earlier step fails → workflow ends in failure, no chain
        # See build_drsc_ocr.py main() for the GITHUB_OUTPUT emit that
        # drives the gate. Matches lc-ocr.yml / fc-ocr.yml / cag-ocr.yml.
        if: >-
          success()
          && github.event_name == 'workflow_dispatch'
          && steps.ocr_run.outputs.processed != '0'
          && steps.ocr_run.outputs.processed != ''
          && steps.ocr_run.outputs.remaining != '0'
          && steps.ocr_run.outputs.remaining != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "OCR progress this run: processed=${{ steps.ocr_run.outputs.processed }} remaining=${{ steps.ocr_run.outputs.remaining }}"
          echo "Chaining another OCR run to continue the backfill."
          gh workflow run drsc-ocr.yml \
            -R ${{ github.repository }} \
            --field max_ocr_per_run=${{ inputs.max_ocr_per_run    || '25'   }} \
            --field max_run_seconds=${{ inputs.max_run_seconds   || '5400'  }} \
            --field max_pages_per_pdf=${{ inputs.max_pages_per_pdf || '300' }} \
            --field render_dpi=${{ inputs.render_dpi              || '150' }}
