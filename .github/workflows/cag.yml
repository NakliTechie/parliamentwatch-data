name: CAG scrape and publish

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      max_listing_pages:
        description: 'How many listing pages to walk (empty = walk to last page)'
        default: ''
      max_extractions:
        description: 'Max PDFs to extract this run (politeness budget)'
        default: '100'
      max_run_seconds:
        description: 'Hard wall-clock cap for the extraction phase, seconds'
        default: '1800'

permissions:
  contents: write

concurrency:
  # Don't let two CAG runs ever overlap — they would race on the on-disk
  # text cache and produce a noisy git diff. Independent of the `scrape`
  # group used by the DRSC workflow, so DRSC and CAG can run concurrently.
  group: cag
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configure git identity for in-flight checkpoint commits
        # build_cag.py performs incremental commits + pushes during the
        # extraction loop (every CHECKPOINT_EVERY_N successful PDFs OR
        # CHECKPOINT_EVERY_S seconds, whichever first), so a runner-killed
        # mid-stream run doesn't lose all its work. The user identity has
        # to be set BEFORE the build step, not just before the final
        # commit step. See CONV.md "Per-file checkpoint pattern".
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build CAG primary data (extract phase only)
        # Split-phase: writers commit reports.json + text/<id>.txt only.
        # Derived files (manifest/bundle/index/meta) are owned by
        # cag-derive.yml — single owner, cancel-in-progress, never races.
        # See CONV.md "Split-phase scraping pattern" for the full rationale.
        env:
          BUILD_PHASE:             'extract'
          MAX_LISTING_PAGES:       ${{ inputs.max_listing_pages || '' }}
          MAX_EXTRACTIONS_PER_RUN: ${{ inputs.max_extractions   || '100' }}
          MAX_RUN_SECONDS:         ${{ inputs.max_run_seconds   || '1800' }}
          EXTRACT_WORKERS:         '4'
          JITTER_MIN_MS:           '250'
          JITTER_MAX_MS:           '500'
        run: python build_cag.py

      - name: Commit and push primary changes
        # Narrow git add to primary files only — reports.json + text/.
        # Derived files (manifest, meta, bundle, index) are intentionally
        # excluded; cag-derive.yml will regenerate them after this commit.
        # `pull --rebase` is still here as a belt-and-suspenders against
        # rare reports.json races (deterministic content, mergeable in
        # almost all cases).
        #
        # `text/` is transient — its contents get bundled into
        # `texts-NN.json` shards by the derive step and the loose dir
        # may not exist in steady state. Stage it only if it exists and
        # is non-empty, otherwise an unconditional `git add` errors out
        # (exit 128) and surfaces a successful no-op run as failure.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/cag/reports.json
          if [ -d docs/cag/text ] && [ -n "$(ls -A docs/cag/text 2>/dev/null)" ]; then
            git add docs/cag/text/
          fi
          if git diff --cached --quiet; then
            echo "no primary changes — skipping push"
            exit 0
          fi
          git commit -m "Auto-update CAG primary data [$(date -u +%Y-%m-%dT%H:%MZ)]"
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push attempt $attempt failed (race); retrying"; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 5 + 3))
          done
          echo "::error::failed to push after 5 attempts"; exit 1
