name: CAG scrape and publish

on:
  schedule:
    # Daily at 06:17 UTC (= 11:47 IST). CAG publishes far less frequently
    # than the DRSC committees (handful of reports per week vs ~tens per
    # day during sessions), so the 4-hour cadence the DRSC scrape uses is
    # overkill here. Daily covers normal cadence; manual workflow_dispatch
    # is the escape hatch for ad-hoc backfills.
    #
    # Off-hour minute (:17) deliberately — top-of-hour is GH's busiest slot
    # for scheduled jobs and runs get delayed up to an hour or sometimes
    # dropped entirely.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      max_listing_pages:
        description: 'How many listing pages to walk (empty = walk to last page)'
        default: ''
      max_extractions:
        description: 'Max PDFs to extract this run (politeness budget)'
        default: '100'
      max_run_seconds:
        description: 'Hard wall-clock cap for the extraction phase, seconds'
        default: '1800'

permissions:
  contents: write

concurrency:
  # Don't let two CAG runs ever overlap — they would race on the on-disk
  # text cache and produce a noisy git diff. Independent of the `scrape`
  # group used by the DRSC workflow, so DRSC and CAG can run concurrently.
  group: cag
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Build CAG primary data (extract phase only)
        # Split-phase: writers commit reports.json + text/<id>.txt only.
        # Derived files (manifest/bundle/index/meta) are owned by
        # cag-derive.yml — single owner, cancel-in-progress, never races.
        # See CONV.md "Split-phase scraping pattern" for the full rationale.
        env:
          BUILD_PHASE:             'extract'
          MAX_LISTING_PAGES:       ${{ inputs.max_listing_pages || '' }}
          MAX_EXTRACTIONS_PER_RUN: ${{ inputs.max_extractions   || '100' }}
          MAX_RUN_SECONDS:         ${{ inputs.max_run_seconds   || '1800' }}
          EXTRACT_WORKERS:         '4'
          JITTER_MIN_MS:           '250'
          JITTER_MAX_MS:           '500'
        run: python build_cag.py

      - name: Commit and push primary changes
        # Narrow git add to primary files only — reports.json + text/.
        # Derived files (manifest, meta, bundle, index) are intentionally
        # excluded; cag-derive.yml will regenerate them after this commit.
        # `pull --rebase` is still here as a belt-and-suspenders against
        # rare reports.json races (deterministic content, mergeable in
        # almost all cases).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/cag/reports.json docs/cag/text/
          git diff --cached --quiet && echo "no primary changes" && exit 0
          git commit -m "Auto-update CAG primary data [$(date -u +%Y-%m-%dT%H:%MZ)]"
          git pull --rebase origin main
          git push
