name: CAG backfill (hourly, until corpus full)

on:
  schedule:
    # Retuned 2026-07-27: hourly -> weekly; CAG backlog is 11.
    # Was '17 * * * *'. The sprint that needed the fast cadence is done;
    # forward discovery (scrape/cag/bills-sansad) gets the slots back.
    # Hourly at :17. Aggressive cadence — every hour for ~1-2 days until
    # the historical CAG corpus is fully extracted, then this workflow
    # gets manually disabled (it's a one-shot ramp, not steady state).
    #
    # Once meta.json shows `candidates_remaining_after_run: 0`, run
    # `gh workflow disable cag-backfill.yml` to stop the firings.
    # The runs cost very little when there's nothing to do (script
    # finds 0 candidates and exits without committing), but cleaning
    # up after the ramp is the courteous move.
    - cron: '17 5 * * 0'
  workflow_dispatch:
    inputs:
      max_extractions:
        description: 'Max PDFs to extract per run (default 200)'
        default: '200'
      max_run_seconds:
        description: 'Hard wall-clock cap (default 2700 = 45 min, leaves 15-min buffer to 60-min runner cap)'
        default: '2700'

permissions:
  contents: write

concurrency:
  # Shared with `cag.yml` (daily) under group `cag` — both workflows
  # regenerate the same derived files (manifest/bundle/index/meta), so
  # serialising avoids the rebase-conflict race that would otherwise
  # happen when an hourly backfill commits at the same time as the daily.
  # `cag-ocr` keeps its own group because it (post-fix in build_cag_ocr.py)
  # only writes disjoint text/*.txt additions, no derived files.
  group: cag
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Bumped from 60 → 300. Recent runs were consistently hitting the
    # 60-min job cap before the script's MAX_RUN_SECONDS=2700 (45 min)
    # internal wall-clock check could fire — likely a few slow PDF
    # downloads per run pushing past the budget. 300 is the safety
    # net; the script's own MAX_RUN_SECONDS still does the actual
    # stopping for healthy runs. Audit 2026-05-15: 8/8 recent runs
    # cancelled at exactly the 60-min mark before this fix.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configure git identity for in-flight checkpoint commits
        # See CONV.md "Per-file checkpoint pattern" — build_cag.py does
        # periodic commit+push during the extraction loop, so identity
        # has to be set before the build step.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build CAG primary data (extract phase, backfill mode)
        # Split-phase: writers commit reports.json + text/<id>.txt only.
        # Derived files are regenerated by cag-derive.yml after this commit
        # lands. See CONV.md "Split-phase scraping pattern".
        env:
          BUILD_PHASE:             'extract'
          MAX_LISTING_PAGES:       ''                     # walk to last page
          MAX_EXTRACTIONS_PER_RUN: ${{ inputs.max_extractions || '200' }}
          MAX_RUN_SECONDS:         ${{ inputs.max_run_seconds || '2700' }}
          EXTRACT_WORKERS:         '4'
          DETAIL_WORKERS:          '4'
          JITTER_MIN_MS:           '250'
          JITTER_MAX_MS:           '500'
        run: python build_cag.py

      - name: Commit and push primary changes
        # Narrow git add to primary files only. Derived files arrive in a
        # separate commit from cag-derive.yml.
        #
        # `text/` is transient — its contents get bundled into
        # `texts-NN.json` shards by the derive step and the loose dir
        # may not exist in steady state. Stage it only if it exists and
        # is non-empty, otherwise an unconditional `git add` errors out
        # (exit 128) and surfaces a successful no-op run as failure.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/cag/reports.json
          if [ -d docs/cag/text ] && [ -n "$(ls -A docs/cag/text 2>/dev/null)" ]; then
            git add docs/cag/text/
          fi
          if git diff --cached --quiet; then
            echo "no primary changes — skipping push"
            exit 0
          fi
          git commit -m "Auto-update CAG primary data (backfill) [$(date -u +%Y-%m-%dT%H:%MZ)]"
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push attempt $attempt failed (race); retrying"; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 5 + 3))
          done
          echo "::error::failed to push after 5 attempts"; exit 1
