name: CAG backfill (hourly, until corpus full)

on:
  schedule:
    # Hourly at :17. Aggressive cadence — every hour for ~1-2 days until
    # the historical CAG corpus is fully extracted, then this workflow
    # gets manually disabled (it's a one-shot ramp, not steady state).
    #
    # Once meta.json shows `candidates_remaining_after_run: 0`, run
    # `gh workflow disable cag-backfill.yml` to stop the firings.
    # The runs cost very little when there's nothing to do (script
    # finds 0 candidates and exits without committing), but cleaning
    # up after the ramp is the courteous move.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      max_extractions:
        description: 'Max PDFs to extract per run (default 500)'
        default: '500'
      max_run_seconds:
        description: 'Hard wall-clock cap (default 3000 = 50 min)'
        default: '3000'

permissions:
  contents: write

concurrency:
  # Distinct from `cag` (daily) and `cag-ocr` (weekly) — backfill runs in
  # parallel with neither blocking nor being blocked by them. Two backfill
  # runs queue rather than overlap (cancel-in-progress: false).
  group: cag-backfill
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Build CAG static data (backfill mode)
        env:
          MAX_LISTING_PAGES:       ''                     # walk to last page
          MAX_EXTRACTIONS_PER_RUN: ${{ inputs.max_extractions || '500' }}
          MAX_RUN_SECONDS:         ${{ inputs.max_run_seconds || '3000' }}
          EXTRACT_WORKERS:         '4'
          JITTER_MIN_MS:           '250'
          JITTER_MAX_MS:           '500'
        run: python build_cag.py

      - name: Commit and push
        # `pull --rebase` before push handles human-vs-bot races AND
        # backfill-vs-daily-cron races (both write to docs/cag/* but
        # use distinct concurrency groups, so they CAN race on git).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Auto-update CAG data (backfill) [$(date -u +%Y-%m-%dT%H:%MZ)]"
          git pull --rebase origin main
          git push
