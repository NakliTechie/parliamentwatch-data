name: Bills (sansad-side) scrape and publish

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      max_extractions:
        description: 'Max PDFs to extract this run (politeness budget)'
        default: '200'
      max_run_seconds:
        description: 'Hard wall-clock cap for the extraction phase, seconds'
        default: '1800'

permissions:
  contents: write

concurrency:
  # Don't let two Bills (sansad-side) runs ever overlap — they would race
  # on the on-disk text cache and produce a noisy git diff. Independent of
  # the `scrape` (DRSC) and `cag` (CAG / CAG-OCR) groups, so all three
  # corpora can run concurrently.
  group: bills-sansad
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 90 min ceiling: scheduled runs (200 extractions in ~15 min) finish well
    # under, but manual workflow_dispatch with larger budgets (1500-2000)
    # needs the headroom. Hard wall-clock cap inside the script via
    # MAX_RUN_SECONDS keeps any single run from approaching this.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configure git identity for in-flight checkpoint commits
        # See CONV.md "Per-file checkpoint pattern" — build_bills_sansad.py
        # does periodic commit+push during the extraction loop, so
        # identity has to be set before the build step.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build Bills (sansad-side) primary data (extract phase only)
        # Split-phase: writers commit text/<id>.txt + .scraper_state.json
        # only. Derived files (manifest/meta/index-shards/bundle/index)
        # are owned by bills-derive.yml — single owner, cancel-in-progress,
        # never races. See CONV.md "Split-phase scraping pattern".
        env:
          BUILD_PHASE:             'extract'
          MAX_EXTRACTIONS_PER_RUN: ${{ inputs.max_extractions || '200' }}
          MAX_RUN_SECONDS:         ${{ inputs.max_run_seconds || '1800' }}
          EXTRACT_WORKERS:         '4'
          JITTER_MIN_MS:           '250'
          JITTER_MAX_MS:           '500'
        run: python build_bills_sansad.py

      - name: Commit and push primary changes
        # Narrow git add to primary files only — text/ + scraper state.
        # Derived files (manifest, meta, index shards, search-bundle,
        # search-index) are excluded; bills-derive.yml regenerates them
        # after this commit lands.
        #
        # `text/` is transient — its contents get bundled into
        # `texts-NN.json` shards by the derive step and the loose dir
        # may not exist in steady state. Stage it only if it exists and
        # is non-empty, otherwise an unconditional `git add` errors out
        # (exit 128) and surfaces a successful no-op run as failure.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/bills/records.json docs/bills/.scraper_state.json
          if [ -d docs/bills/text ] && [ -n "$(ls -A docs/bills/text 2>/dev/null)" ]; then
            git add docs/bills/text/
          fi
          if git diff --cached --quiet; then
            echo "no primary changes — skipping push"
            exit 0
          fi
          git commit -m "Auto-update Bills (sansad) primary data [$(date -u +%Y-%m-%dT%H:%MZ)]"
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push attempt $attempt failed (race); retrying"; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 5 + 3))
          done
          echo "::error::failed to push after 5 attempts"; exit 1
