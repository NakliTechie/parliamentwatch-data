name: CAG OCR slow-lane

on:
  schedule:
    # Weekly, Sunday 02:17 UTC (= 07:47 IST Sunday morning). OCR is
    # expensive — ~8 min per scanned audit report. We process a small
    # batch each week and slowly close the gap. Most of the corpus is
    # text-extractable; the slow lane only handles the residue.
    #
    # Off-hour minute (:17) deliberately, same reasoning as scrape.yml /
    # cag.yml.
    - cron: '17 2 * * 0'
  workflow_dispatch:
    inputs:
      max_ocr_per_run:
        description: 'Max scanned PDFs to OCR this run (default 5)'
        default: '5'
      max_run_seconds:
        description: 'Hard wall-clock cap for OCR phase (seconds, default 2700)'
        default: '2700'
      max_pages_per_pdf:
        description: 'Cap pages per PDF (default 300)'
        default: '300'
      render_dpi:
        description: 'pdf2image render DPI (default 150)'
        default: '150'

permissions:
  contents: write

concurrency:
  # Same group as cag.yml + cag-backfill.yml. Earlier rationale for a
  # separate `cag-ocr` group claimed OCR writes "disjoint text/*.txt
  # additions" — that was wrong. Both the backfill (pypdf) and OCR
  # (tesseract) target the same `text/<id>.txt` paths for the same
  # "missing-text" candidate set, so they race on git: a parallel OCR
  # run finished its work and got an add/add merge conflict on every
  # file the backfill committed in the meantime (run 25621177677,
  # 4 OCRs lost). Serialise via shared `cag` group instead. OCR is
  # ~weekly cadence; daily/hourly CAG runs aren't blocked enough to
  # matter, and OCR's candidate list is cleaner after the backfill
  # has had its turn.
  group: cag
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install OCR system deps
        # tesseract-ocr — the OCR engine
        # tesseract-ocr-hin — Hindi language pack (some CAG reports mix
        #                     English + Hindi sections)
        # poppler-utils — pdf2image renders pages via poppler's pdftoppm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-hin poppler-utils

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configure git identity for in-flight checkpoint commits
        # build_cag_ocr.py commits per-OCR (CHECKPOINT_EVERY_N=2 default,
        # tuned for OCR's 3-8 min per-PDF cost) so a runner-killed mid-OCR
        # run loses at most one OCR's worth of work. See CONV.md
        # "Per-file checkpoint pattern".
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: OCR scanned PDFs
        env:
          MAX_OCR_PER_RUN:    ${{ inputs.max_ocr_per_run    || '5' }}
          MAX_RUN_SECONDS:    ${{ inputs.max_run_seconds    || '2700' }}
          MAX_PAGES_PER_PDF:  ${{ inputs.max_pages_per_pdf  || '300' }}
          RENDER_DPI:         ${{ inputs.render_dpi         || '150' }}
          TESSERACT_LANGS:    'eng+hin'
        run: python build_cag_ocr.py

      - name: Commit and push primary changes
        # OCR is part of the primary-write tier — it produces text/<id>.txt
        # and tombstone files. Derived files (manifest/bundle/index/meta)
        # are regenerated by cag-derive.yml after this commit lands.
        # Narrow git add to text/ only — text additions auto-merge cleanly
        # against any concurrent backfill/daily commits because they
        # target different filenames.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/cag/text/
          git diff --cached --quiet && echo "no primary changes" && exit 0
          git commit -m "Auto-update CAG OCR data [$(date -u +%Y-%m-%dT%H:%MZ)]"
          git pull --rebase origin main
          git push
