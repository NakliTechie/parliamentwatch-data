name: Scrape and publish

on:
  schedule:
    - cron: '30 4 * * *'   # 04:30 UTC daily = 10:00 IST
  workflow_dispatch:
    inputs:
      lok_sabhas:
        description: 'Comma-separated Lok Sabha numbers to scrape'
        default: '18'
      text_limit:
        description: 'Max reports per committee to extract text for'
        default: '20'

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Build static data
        env:
          LOK_SABHAS: ${{ inputs.lok_sabhas || '18' }}
          TEXT_LIMIT_PER_COMMITTEE: ${{ inputs.text_limit || '20' }}
        run: python build_static.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Auto-update data [$(date -u +%Y-%m-%dT%H:%MZ)]"
          git push
