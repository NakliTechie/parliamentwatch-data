name: Scrape and publish

on:
  schedule:
    # Every 4 hours. With max_extractions=400 (env default in this workflow),
    # 6 runs/day × 400 = 2,400 PDFs/day = ~5.5 days to complete the LS14-18
    # historical backfill (~13,300 candidates as of 2026-05-08).
    #
    # build_static.py has a rate-limit cooldown guard (6h) that skips the
    # extraction phase when the previous run was 429'd by sansad.in, so
    # this cron is safe to fire-and-forget — at most one wasted cycle per
    # rate-limit event.
    #
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      lok_sabhas:
        description: 'Comma-separated Lok Sabha numbers to scrape'
        default: '18'
      max_extractions:
        description: 'Max PDFs to extract this run (politeness budget)'
        default: '400'
      max_run_seconds:
        description: 'Hard wall-clock cap for the extraction phase, seconds'
        default: '1800'

permissions:
  contents: write

concurrency:
  # Don't let two scheduled or manual runs ever overlap — they would race on
  # the on-disk text cache and produce a noisy git diff.
  group: scrape
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Build DRSC primary data (extract phase only)
        # Split-phase: writers commit reports.json + text/<committee>/<file_id>.txt
        # only. Derived files (manifest/committees/bundle/index/meta) are
        # owned by drsc-derive.yml — single owner, cancel-in-progress, never
        # races. See CONV.md "Split-phase scraping pattern".
        env:
          BUILD_PHASE:             'extract'
          LOK_SABHAS:              ${{ inputs.lok_sabhas       || '18' }}
          MAX_EXTRACTIONS_PER_RUN: ${{ inputs.max_extractions  || '400' }}
          MAX_RUN_SECONDS:         ${{ inputs.max_run_seconds  || '1800' }}
          EXTRACT_WORKERS:         '4'
          JITTER_MIN_MS:           '250'
          JITTER_MAX_MS:           '500'
        run: python build_static.py

      - name: Commit and push primary changes
        # Narrow git add to primary files only — reports.json + text/.
        # Derived files (manifest, committees, meta, bundle, index) are
        # intentionally excluded; drsc-derive.yml regenerates them after
        # this commit lands.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/drsc/reports.json docs/drsc/text/
          git diff --cached --quiet && echo "no primary changes" && exit 0
          git commit -m "Auto-update DRSC primary data [$(date -u +%Y-%m-%dT%H:%MZ)]"
          git pull --rebase origin main
          git push
