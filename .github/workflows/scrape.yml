name: Scrape and publish

on:
  schedule:
    # 22:00 UTC = 03:30 IST. Off-peak for sansad.in (and downstream IST users).
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      lok_sabhas:
        description: 'Comma-separated Lok Sabha numbers to scrape'
        default: '18'
      max_extractions:
        description: 'Max PDFs to extract this run (politeness budget)'
        default: '400'
      max_run_seconds:
        description: 'Hard wall-clock cap for the extraction phase, seconds'
        default: '1800'

permissions:
  contents: write

concurrency:
  # Don't let two scheduled or manual runs ever overlap — they would race on
  # the on-disk text cache and produce a noisy git diff.
  group: scrape
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Build static data
        env:
          LOK_SABHAS:              ${{ inputs.lok_sabhas       || '18' }}
          MAX_EXTRACTIONS_PER_RUN: ${{ inputs.max_extractions  || '400' }}
          MAX_RUN_SECONDS:         ${{ inputs.max_run_seconds  || '1800' }}
          EXTRACT_WORKERS:         '4'
          JITTER_MIN_MS:           '250'
          JITTER_MAX_MS:           '500'
        run: python build_static.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Auto-update data [$(date -u +%Y-%m-%dT%H:%MZ)]"
          git push
