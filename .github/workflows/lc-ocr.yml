name: LC OCR slow-lane

on:
  schedule:
    # Weekly, Sunday 03:23 UTC (= 08:53 IST Sunday morning). OCR is
    # expensive — ~8 min per scanned LC report. We process a small batch
    # each week and slowly close the gap. Most of the corpus is text-
    # extractable; the slow lane only handles older scanned reports
    # (1950s-1990s residue).
    #
    # Off-hour minute (:23) deliberately, same family as lc.yml at :23.
    # Off-hour from cag-ocr (02:17 UTC) so the runners don't pile up.
    - cron: '23 3 * * 0'
  workflow_dispatch:
    inputs:
      max_ocr_per_run:
        description: 'Max scanned PDFs to OCR this run (default 5)'
        default: '5'
      max_run_seconds:
        description: 'Hard wall-clock cap for OCR phase (seconds, default 2700)'
        default: '2700'
      max_pages_per_pdf:
        description: 'Cap pages per PDF (default 400)'
        default: '400'
      render_dpi:
        description: 'pdf2image render DPI (default 150)'
        default: '150'

permissions:
  contents: write
  # Needed for the end-of-workflow chain step that fires another
  # workflow_dispatch when the manual sprint hits the budget cap but
  # backlog remains. See "Chain another OCR run if backlog remains" below.
  actions: write

concurrency:
  # Same group as lc.yml. Both the daily run (pypdf) and OCR (tesseract)
  # target the same `text/<id>.txt` paths for the same "missing-text"
  # candidate set, so they race on git. Serialise via the shared `lc`
  # group. OCR is ~weekly cadence; daily LC runs aren't blocked enough
  # to matter, and OCR's candidate list is cleaner after the daily has
  # had its turn (which populates the .pypdf-empty markers OCR uses
  # to pick its candidates).
  group: lc
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    # Bumped from 60 → 350 (just under GitHub's 6h hard ceiling) so a single
    # workflow_dispatch with a high `max_ocr_per_run` can clear a large
    # backlog in one run. The regular weekly cron still uses the default
    # MAX_RUN_SECONDS=2700 (45 min) and only consumes a fraction of this
    # budget, so the bump is harmless for scheduled firings.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Install OCR system deps
        # tesseract-ocr — the OCR engine
        # tesseract-ocr-hin — Hindi language pack (some LC reports have
        #                     Hindi appendices, especially Constitution-
        #                     adjacent ones)
        # poppler-utils — pdf2image renders pages via poppler's pdftoppm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-hin poppler-utils

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configure git identity for in-flight checkpoint commits
        # build_lc_ocr.py commits per-OCR (CHECKPOINT_EVERY_N=2 default,
        # tuned for OCR's 3-8 min per-PDF cost) so a runner-killed mid-OCR
        # run loses at most one OCR's worth of work. See CONV.md
        # "Per-file checkpoint pattern".
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare sansadsaar-lc archive working tree
        # See lc.yml for the full rationale. OCR-side archival is doubly
        # important: scanned-only PDFs are the rare / hardest-to-replace
        # ones in the corpus, and pypdf already confirmed pypdf can't read
        # them, so the actual byte stream IS the source of truth.
        env:
          LC_ARCHIVE_TOKEN: ${{ secrets.LC_ARCHIVE_TOKEN }}
        run: |
          ARCHIVE_DIR="$(pwd)/../sansadsaar-lc"
          mkdir -p "$ARCHIVE_DIR"
          cd "$ARCHIVE_DIR"
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          REMOTE_URL="https://x-access-token:${LC_ARCHIVE_TOKEN}@github.com/NakliTechie/sansadsaar-lc.git"
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "$REMOTE_URL"
          else
            git remote add origin "$REMOTE_URL"
          fi
          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
          else
            echo "remote main does not exist yet — will create on first push"
          fi
          if [ ! -f README.md ]; then
            cp "$GITHUB_WORKSPACE/lc/templates/archive-README.md" README.md
          fi

      - name: OCR scanned PDFs
        id: ocr_run
        env:
          MAX_OCR_PER_RUN:    ${{ inputs.max_ocr_per_run    || '5' }}
          MAX_RUN_SECONDS:    ${{ inputs.max_run_seconds    || '2700' }}
          MAX_PAGES_PER_PDF:  ${{ inputs.max_pages_per_pdf  || '400' }}
          RENDER_DPI:         ${{ inputs.render_dpi         || '150' }}
          TESSERACT_LANGS:    'eng+hin'
          LC_ARCHIVE_DIR:     ${{ github.workspace }}/../sansadsaar-lc
        run: python build_lc_ocr.py

      - name: Commit and push sansadsaar-lc archive
        continue-on-error: true
        run: |
          ARCHIVE_DIR="$(pwd)/../sansadsaar-lc"
          cd "$ARCHIVE_DIR"
          git add .
          if git diff --cached --quiet; then
            echo "no archive changes — skipping push"
            exit 0
          fi
          git commit -m "Auto-archive LC PDFs (OCR run) [$(date -u +%Y-%m-%dT%H:%MZ)]"
          git push -u origin main

      - name: Commit and push primary changes
        # OCR is part of the primary-write tier — it produces text/<id>.txt
        # and tombstone files. Derived files (manifest/bundle/index/meta)
        # are regenerated by lc-derive.yml after this commit lands.
        # Narrow git add to text/ only — text additions auto-merge cleanly
        # against any concurrent daily commits because they target
        # different filenames.
        #
        # `text/` is transient — its contents get bundled into
        # `texts-NN.json` shards by the derive step and the loose dir
        # may not exist in steady state. Stage it only if it exists and
        # is non-empty, otherwise an unconditional `git add` errors out
        # (exit 128) and surfaces a successful no-op run as failure.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d docs/lc/text ] && [ -n "$(ls -A docs/lc/text 2>/dev/null)" ]; then
            git add docs/lc/text/
          fi
          if git diff --cached --quiet; then
            echo "no primary changes — skipping push"
            exit 0
          fi
          git commit -m "Auto-update LC OCR data [$(date -u +%Y-%m-%dT%H:%MZ)]"
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push attempt $attempt failed (race); retrying"; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 5 + 3))
          done
          echo "::error::failed to push after 5 attempts"; exit 1

      - name: Chain another OCR run if backlog remains
        # Sprint-completion mechanism. Only runs when this workflow was
        # triggered manually (workflow_dispatch) — never on the weekly
        # cron — and only re-fires when we made progress this run AND
        # there's still backlog. Self-terminates when:
        #   - remaining=0  → backlog cleared, no chain
        #   - processed=0  → no progress made (e.g., all candidates
        #                    were heavy and timed out), abort to avoid
        #                    a no-op loop
        #   - any earlier step fails → workflow ends in failure, no chain
        # See build_lc_ocr.py main() for the GITHUB_OUTPUT emit that
        # drives the gate.
        if: >-
          success()
          && github.event_name == 'workflow_dispatch'
          && steps.ocr_run.outputs.processed != '0'
          && steps.ocr_run.outputs.processed != ''
          && steps.ocr_run.outputs.remaining != '0'
          && steps.ocr_run.outputs.remaining != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "OCR progress this run: processed=${{ steps.ocr_run.outputs.processed }} remaining=${{ steps.ocr_run.outputs.remaining }}"
          echo "Chaining another OCR run to continue the backfill."
          # Pass the same sprint-sized inputs through to the chained run
          # so it keeps the big budget instead of falling back to the
          # weekly-cron defaults.
          gh workflow run lc-ocr.yml \
            -R ${{ github.repository }} \
            --field max_ocr_per_run=${{ inputs.max_ocr_per_run    || '200'   }} \
            --field max_run_seconds=${{ inputs.max_run_seconds   || '20400' }} \
            --field max_pages_per_pdf=${{ inputs.max_pages_per_pdf || '400' }} \
            --field render_dpi=${{ inputs.render_dpi              || '150' }}
