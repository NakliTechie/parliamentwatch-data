name: Debates scrape and publish

# 12×/day walk of Lok Sabha debate-search + body-fetch.
#
# Phase A: LS only. Phase B (Rajya Sabha) will land in this same
# workflow when we add the RS scraper; the build_debates.py orchestrator
# is house-keyed so the addition is strictly additive.
#
# Cadence rationale: 50 records per burst × 12×/day = 600/day. Clears
# the ~64K-record LS-13..18 backlog in ~110 days. Within Politeness
# policy: per-burst ≤50, ≥1-hour gaps (2-hour gaps here). LS bursts
# are pure JSON+HTML — no PDF downloads — so each "extraction" is
# ~100-500 ms; 50 takes ~25 sec sustained.
#
# When RS phase B lands, we'll drop LS to 6×/day cron (current term
# only) and add a parallel 6×/day RS workflow. Combined steady-state
# load will remain ≤600/day.
#
# Off-cluster from LC (02/06/10/14/18/22) and FC (01/05/09/13/17/21).
# Debates fires at :23 every 2 hours starting at 00:23 UTC.

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      lok_sabhas:
        description: 'LS terms to walk (CSV, default = LS-14..18 to match DRSC depth)'
        default: '14,15,16,17,18'
      rs_sessions:
        description: 'RS sessions to walk (CSV, "all" for full backfill, default = 2 most recent)'
        default: ''
      max_extractions:
        description: 'Max LS records to extract this run. Keep ≤50 per Politeness policy.'
        default: '50'
      max_rs_extractions:
        description: 'Max RS PDFs to extract this run. Keep ≤25 per Politeness policy (PDFs are heavier than LS HTML).'
        default: '25'
      max_run_seconds:
        description: 'Hard wall-clock cap (seconds)'
        default: '900'

permissions:
  contents: write

concurrency:
  # Don't let two debates runs overlap. Independent of `cag`/`lc`/`fc`/
  # `scrape` so all corpora can run concurrently.
  group: debates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configure git identity for in-flight checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build debates primary data (extract phase only)
        # Split-phase: writers commit reports.json + text/<house>/.
        # Derived files owned by debates-derive.yml. See CONV.md
        # "Split-phase scraping pattern".
        env:
          BUILD_PHASE:                'extract'
          LOK_SABHAS:                 ${{ inputs.lok_sabhas         || '14,15,16,17,18' }}
          RS_SESSIONS:                ${{ inputs.rs_sessions        || '' }}
          MAX_EXTRACTIONS_PER_RUN:    ${{ inputs.max_extractions    || '50' }}
          MAX_RS_EXTRACTIONS_PER_RUN: ${{ inputs.max_rs_extractions || '25' }}
          MAX_RUN_SECONDS:            ${{ inputs.max_run_seconds    || '900' }}
          EXTRACT_WORKERS:            '4'
          JITTER_MIN_MS:              '250'
          JITTER_MAX_MS:              '500'
        run: python build_debates.py

      - name: Commit and push primary changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/debates/reports.json docs/debates/text/
          git diff --cached --quiet && echo "no primary changes" && exit 0
          git commit -m "Auto-update debates primary data [$(date -u +%Y-%m-%dT%H:%MZ)]"
          git pull --rebase origin main
          git push
