name: LC scrape and publish

# 6×/day walk of the 22 Law-Commission-term pages on
# lawcommissionofindia.nic.in. Walks the listing, merges into reports.json,
# extracts text from missing PDFs up to MAX_EXTRACTIONS_PER_RUN.
#
# Also archives each freshly-downloaded PDF into the sibling
# `sansadsaar-lc` repo (durability hedge against the fragile WordPress /
# S3WaaS upstream). See plan/law-commission-recon-001.md + lc/scraper.py
# archive_pdf() for the rationale.
#
# Cadence rationale: every 4 hours, 25 PDFs per run = 150/day. Smaller
# bursts are friendlier to the WordPress / S3WaaS upstream than 100-in-
# one-shot, and 150/day clears the ~290-report backlog in ~2 days. No
# separate backfill workflow — at this cadence the daily firings catch
# the backlog faster than a dedicated backfill would. If you ever need a
# one-shot full backfill, workflow_dispatch this with max_extractions=500.
#
# Off-hour minute (:23 UTC) deliberately, off-cluster from existing
# crons (DRSC=:17, CAG=:17, Bills=:17). 02:23 UTC anchor lands the first
# of the day's runs in the IST early-morning low-load window
# (07:53 IST); subsequent firings are spread evenly across the day.

on:
  schedule:
    - cron: '23 2,6,10,14,18,22 * * *'
  workflow_dispatch:
    inputs:
      max_extractions:
        description: 'Max PDFs to extract this run (politeness budget)'
        default: '25'
      max_run_seconds:
        description: 'Hard wall-clock cap for the extraction phase, seconds'
        default: '900'

permissions:
  contents: write

concurrency:
  # Don't let two LC runs ever overlap — they would race on the on-disk
  # text cache and produce a noisy git diff. Independent of `cag` and
  # `scrape` groups, so all three corpora can run concurrently.
  group: lc
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configure git identity for in-flight checkpoint commits
        # build_lc.py performs incremental commits + pushes during the
        # extraction loop (every CHECKPOINT_EVERY_N successful PDFs OR
        # CHECKPOINT_EVERY_S seconds, whichever first), so a runner-killed
        # mid-stream run doesn't lose all its work. The user identity has
        # to be set BEFORE the build step, not just before the final
        # commit step. See CONV.md "Per-file checkpoint pattern".
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare sansadsaar-lc archive working tree
        # Clone the PDF-archive repo to a sibling path. First-run case:
        # repo exists but has no `main` branch yet (created empty by hand).
        # We git-init locally, set the remote with the PAT, fetch if the
        # remote main exists, otherwise prepare to push a brand-new main.
        #
        # The PAT (LC_ARCHIVE_TOKEN) is a fine-grained token scoped to
        # Contents:write on sansadsaar-lc only. It's masked in workflow
        # logs by GH Actions' secret redaction.
        env:
          LC_ARCHIVE_TOKEN: ${{ secrets.LC_ARCHIVE_TOKEN }}
        run: |
          ARCHIVE_DIR="$(pwd)/../sansadsaar-lc"
          mkdir -p "$ARCHIVE_DIR"
          cd "$ARCHIVE_DIR"
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          REMOTE_URL="https://x-access-token:${LC_ARCHIVE_TOKEN}@github.com/NakliTechie/sansadsaar-lc.git"
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "$REMOTE_URL"
          else
            git remote add origin "$REMOTE_URL"
          fi
          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            echo "remote main exists; pulling current state"
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
          else
            echo "remote main does not exist yet — will create on first push"
          fi
          # Seed README.md if missing. We commit/push the README in the
          # same commit as the first archived PDF so the initial repo
          # state isn't bare. Subsequent runs see README and leave it.
          if [ ! -f README.md ]; then
            cp "$GITHUB_WORKSPACE/lc/templates/archive-README.md" README.md
          fi

      - name: Build LC primary data (extract phase only)
        # Split-phase: writers commit reports.json + text/<id>.txt only.
        # Derived files (manifest/bundle/index/meta) are owned by
        # lc-derive.yml — single owner, cancel-in-progress, never races.
        # See CONV.md "Split-phase scraping pattern" for the full rationale.
        #
        # LC_ARCHIVE_DIR enables PDF archival as a side-effect of each
        # successful download. archive_pdf() in lc/scraper.py is
        # idempotent (sha256+size short-circuit) so re-runs don't churn
        # the archive repo.
        env:
          BUILD_PHASE:             'extract'
          MAX_EXTRACTIONS_PER_RUN: ${{ inputs.max_extractions || '25' }}
          MAX_RUN_SECONDS:         ${{ inputs.max_run_seconds || '900' }}
          EXTRACT_WORKERS:         '4'
          JITTER_MIN_MS:           '250'
          JITTER_MAX_MS:           '500'
          LC_ARCHIVE_DIR:          ${{ github.workspace }}/../sansadsaar-lc
        run: python build_lc.py

      - name: Commit and push sansadsaar-lc archive
        # Push BEFORE the parliamentwatch-data commit so an archive push
        # failure can't leave reports.json + text/ pointing at PDFs that
        # the archive doesn't have. (We tolerate a temporary divergence
        # the other direction — archive has PDFs whose text isn't yet on
        # the mirror — much more easily.)
        #
        # `continue-on-error: true` because the archive is a hedge, not
        # a blocker — if cross-repo auth has a hiccup, the main pipeline
        # still publishes; the next daily run will catch up the archive.
        continue-on-error: true
        run: |
          ARCHIVE_DIR="$(pwd)/../sansadsaar-lc"
          cd "$ARCHIVE_DIR"
          git add .
          if git diff --cached --quiet; then
            echo "no archive changes — skipping push"
            exit 0
          fi
          git commit -m "Auto-archive LC PDFs [$(date -u +%Y-%m-%dT%H:%MZ)]"
          # First push needs -u to set upstream; subsequent runs just push.
          # `--force-with-lease` would be safer than --force, but plain
          # push is right here — the workflow is the only writer.
          git push -u origin main

      - name: Commit and push primary changes
        # Narrow git add to primary files only — reports.json + text/.
        # Derived files (manifest, meta, bundle, index) are intentionally
        # excluded; lc-derive.yml will regenerate them after this commit.
        # `pull --rebase` is still here as a belt-and-suspenders against
        # rare reports.json races (deterministic content, mergeable in
        # almost all cases).
        #
        # `text/` is transient — its contents get bundled into
        # `texts-NN.json` shards by the derive step and the loose dir
        # may not exist in steady state. Stage it only if it exists and
        # is non-empty, otherwise an unconditional `git add` errors out
        # (exit 128) and surfaces a successful no-op run as failure.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/lc/reports.json
          if [ -d docs/lc/text ] && [ -n "$(ls -A docs/lc/text 2>/dev/null)" ]; then
            git add docs/lc/text/
          fi
          if git diff --cached --quiet; then
            echo "no primary changes — skipping push"
            exit 0
          fi
          git commit -m "Auto-update LC primary data [$(date -u +%Y-%m-%dT%H:%MZ)]"
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push attempt $attempt failed (race); retrying"; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 5 + 3))
          done
          echo "::error::failed to push after 5 attempts"; exit 1
